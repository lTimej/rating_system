version: '3.8'

services:
  # 单一应用服务（前端+后端）
  rating-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rating-system-app
    ports:
      - "80:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - GIN_MODE=release
      - DB_PATH=/app/data/rating_system.db
    restart: unless-stopped

volumes:
  data:
    driver: local
  uploads:
    driver: local
