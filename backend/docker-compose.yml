version: '3.8'

services:
  # 单一应用服务（前端+后端）
  rating-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rating-system-app
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - GIN_MODE=release
      - DB_PATH=/app/data/rating_system.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
    driver: local
  uploads:
    driver: local
